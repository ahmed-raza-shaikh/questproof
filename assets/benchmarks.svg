<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc"><title id="title">QuestProof</title><desc id="desc">Benchmarks: QuestProof</desc><defs><style>@font-face{font-family:'instrument-400-0';src:url(data:font/woff;base64,) format('woff');font-weight:400}@font-face{font-family:'newsreader-400-72';src:url(data:font/woff;base64,) format('woff');font-weight:400}@font-face{font-family:'plexmono500-500-0';src:url(data:font/woff;base64,) format('woff');font-weight:500}.cap{font-family:'instrument-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#5A5146;letter-spacing:0.0em;}.lead{font-family:'newsreader-400-72',system-ui,sans-serif;font-weight:400;font-size:64px;fill:#1F1B16;letter-spacing:-0.03em;}.unit{font-family:'instrument-400-0',system-ui,sans-serif;font-weight:400;font-size:20px;fill:#5A5146;letter-spacing:0.0em;}.note{font-family:'instrument-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#6C6458;letter-spacing:0.0em;}.rl{font-family:'instrument-400-0',system-ui,sans-serif;font-weight:400;font-size:15px;fill:#1F1B16;letter-spacing:0.0em;}.rv{font-family:'plexmono500-500-0',system-ui,sans-serif;font-weight:500;font-size:15px;fill:#1F1B16;letter-spacing:0.0em;}.rn{font-family:'instrument-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#6C6458;letter-spacing:0.0em;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}text{font-variant-numeric:tabular-nums;font-kerning:normal}</style></defs><rect width="960" height="232" rx="16" fill="#F6F2E9"/><rect x="0.5" y="0.5" width="959" height="231" rx="15.5" fill="none" stroke="rgba(31,27,22,0.11)"/><text class="cap" x="40.0" y="56.0" xml:space="preserve" >Automatic answers that were right</text><text class="lead" x="38.0" y="128.0" xml:space="preserve" >44/44</text><text class="unit" x="215.1" y="128.0" xml:space="preserve" ></text><text class="note" x="40.0" y="164.0" xml:space="preserve" >Correct value and correct source document on</text><text class="note" x="40.0" y="184.0" xml:space="preserve" >the 53-question gold set.</text><line x1="368" y1="32" x2="368" y2="200" stroke="rgba(31,27,22,0.11)"/><text class="rl" x="400.0" y="56.0" xml:space="preserve" >Uncovered questions sent to a person</text><text class="rv" x="920.0" y="56.0" text-anchor="end" xml:space="preserve" >7/7</text><text class="rn" x="400.0" y="76.0" xml:space="preserve" >Nothing outside the policies was answered automatically</text><line x1="400" y1="92" x2="920" y2="92" stroke="rgba(31,27,22,0.11)"/><text class="rl" x="400.0" y="112.0" xml:space="preserve" >Answerable questions automated</text><text class="rv" x="920.0" y="112.0" text-anchor="end" xml:space="preserve" >95.7%</text><text class="rn" x="400.0" y="132.0" xml:space="preserve" >The two misses use wording the policies do not contain</text><line x1="400" y1="148" x2="920" y2="148" stroke="rgba(31,27,22,0.11)"/><text class="rl" x="400.0" y="168.0" xml:space="preserve" >Time per question</text><text class="rv" x="920.0" y="168.0" text-anchor="end" xml:space="preserve" >24 µs</text><text class="rn" x="400.0" y="188.0" xml:space="preserve" >53 questions against 5,000 policy sections in 1.3 ms</text></svg>
