[package]
name = "compliance-autopilot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "answer"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
